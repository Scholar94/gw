name: Secret scan
# Free open-source scanner (TruffleHog). GitHub's own secret scanning + push protection is also free on public repos:
# enable both in Settings > Code security. Fails the build if a verified live secret is committed.
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: trufflesecurity/trufflehog@v3.82.13
        with: { extra_args: --only-verified }
