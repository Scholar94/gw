name: Deploy edge Worker
# Free: Cloudflare Workers free plan (100,000 requests/day). Needs repo secrets CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers")
# and CLOUDFLARE_ACCOUNT_ID. Skips cleanly (green) until you add them.
# Step 1 CHECKS the Cloudflare credentials first and says in plain words what is wrong (wrong account ID, token without permission, typo).
# The Worker's own secrets (TURNSTILE_SECRET, FIREBASE_SERVICE_ACCOUNT and the OPTIONAL GOOGLE_API_KEY, PAYSTACK_SECRET, FLUTTERWAVE_SECRET,
# BREVO_API_KEY) are uploaded AFTER the deploy, and only the ones you have actually set (an unset optional secret never breaks the deploy).
on:
  push: { branches: [main], paths: ['worker.js', 'wrangler.toml', '.github/workflows/deploy-worker.yml'] }
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: deploy-worker, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax check
        run: node --check worker.js

      - name: Check the Cloudflare token and Account ID
        if: env.HAS_CF == 'true'
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Remove invisible spaces/new lines that often get pasted along with a secret (the most common cause of "Authentication error 10000")
          TOKEN="$(printf %s "$RAW_TOKEN" | tr -d '[:space:]')"
          ACC="$(printf %s "$RAW_ACCOUNT" | tr -d '[:space:]')"
          echo "::add-mask::$TOKEN"
          if ! printf %s "$ACC" | grep -Eq '^[0-9a-fA-F]{32}$'; then
            echo "::error title=CLOUDFLARE_ACCOUNT_ID is not valid::It must be exactly 32 letters and numbers (yours has ${#ACC} characters). Cloudflare dashboard > Workers & Pages > Overview > copy the Account ID again, then edit the GitHub secret CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          if [ "${#TOKEN}" -lt 30 ]; then
            echo "::error title=CLOUDFLARE_API_TOKEN looks wrong::It is only ${#TOKEN} characters. A real token is about 40 characters. Create a new one (Cloudflare > My Profile > API Tokens > Create Token > template 'Edit Cloudflare Workers') and copy the token itself, not the 'Token ID'."
            exit 1
          fi
          verify="$(curl -s -H "Authorization: Bearer $TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify || true)"
          if printf %s "$verify" | grep -q '"status":"active"'; then echo "Token is valid and active."; else echo "Could not confirm the token with the user check (normal for some token types); testing it against your account instead."; fi
          code="$(curl -s -o /tmp/cf.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts" || echo 000)"
          case "$code" in
            200) echo "Cloudflare accepted the token for this account. Continuing." ;;
            401|403)
              echo "::error title=Cloudflare refused the token for this account::Most likely causes, in this order: (1) CLOUDFLARE_ACCOUNT_ID is from a DIFFERENT Cloudflare account than the one the token was made in (check the 32-character code in the address bar after dash.cloudflare.com/ while you are on Workers & Pages); (2) the token was not made from the 'Edit Cloudflare Workers' template, or its Account Resources is not set to your account; (3) a character was lost when copying the token. Make a NEW token and replace the GitHub secret."
              exit 1 ;;
            000) echo "::error title=Could not reach Cloudflare::Network problem on the GitHub runner. Re-run the job."; exit 1 ;;
            *) echo "::error title=Unexpected answer from Cloudflare ($code)::$(head -c 300 /tmp/cf.json)"; exit 1 ;;
          esac
          # Pass the cleaned values to the next steps
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> "$GITHUB_ENV"

      - name: Deploy the Worker
        if: env.HAS_CF == 'true'
        run: npx --yes wrangler@3 deploy

      - name: Upload the Worker's secrets (only those you have set)
        if: env.HAS_CF == 'true'
        env:
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PAYSTACK_SECRET: ${{ secrets.PAYSTACK_SECRET }}
          FLUTTERWAVE_SECRET: ${{ secrets.FLUTTERWAVE_SECRET }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          node -e '
            const required = ["TURNSTILE_SECRET", "FIREBASE_SERVICE_ACCOUNT"];
            const optional = ["GOOGLE_API_KEY", "PAYSTACK_SECRET", "FLUTTERWAVE_SECRET", "BREVO_API_KEY"];
            const out = {}, set = [], missing = [];
            for (const n of required.concat(optional)) { const v = process.env[n]; if (v && v.trim()) { out[n] = v; set.push(n); } else missing.push(n); }
            for (const n of required) if (!out[n]) console.log("::warning::Required secret " + n + " is not set in GitHub (Settings > Secrets and variables > Actions). The forms will not work until you add it and re-run this workflow.");
            console.log("Uploading " + set.length + " secret(s): " + (set.join(", ") || "none"));
            console.log("Not set (fine if optional): " + (missing.join(", ") || "none"));
            require("fs").writeFileSync("worker-secrets.json", JSON.stringify(out));
          '
          if [ "$(node -p 'Object.keys(JSON.parse(require("fs").readFileSync("worker-secrets.json","utf8"))).length')" != "0" ]; then
            npx --yes wrangler@3 secret bulk worker-secrets.json
          else
            echo "No secrets to upload."
          fi
          rm -f worker-secrets.json

      - name: Note
        if: env.HAS_CF != 'true'
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipped deploy (this is fine until you set up Cloudflare)."
