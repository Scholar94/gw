name: CodeQL
# Free for public repositories. Finds injection, XSS and unsafe-DOM bugs in JavaScript and Python.
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule: [{ cron: '17 3 * * 1' }]
permissions: { contents: read }
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions: { security-events: write, contents: read, actions: read }
    strategy: { fail-fast: false, matrix: { language: [javascript-typescript, python] } }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: '${{ matrix.language }}', queries: security-extended }
      - uses: github/codeql-action/analyze@v3
