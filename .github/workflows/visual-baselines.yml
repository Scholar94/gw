name: Visual baselines
# Run manually (Actions tab > Visual baselines > Run workflow) after an intentional design change. It regenerates snap-*.png on the
# same OS the CI compares on, then commits them.
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright pillow && playwright install --with-deps chromium
      - run: python3 test-visual.py --update
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snap-*.png; git diff --cached --quiet || git commit -m "chore: update visual baselines"; git push
