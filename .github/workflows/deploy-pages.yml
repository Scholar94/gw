name: Deploy site (GitHub Pages)
# One-time setup: Settings > Pages > Source = "GitHub Actions". Free for public repositories.
# Optional repo variable SITE_URL (Settings > Variables) = your public address, e.g. https://you.github.io/gw  or your own domain.
# It is stamped into canonical links, sitemap and feeds. Defaults to https://<owner>.github.io/<repo>.
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - name: Stamp the real site address and regenerate pages
        env: { SITE_URL: '${{ vars.SITE_URL }}' }
        run: |
          URL="${SITE_URL:-https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}}"
          python3 build-pages.py && python3 build-seo.py "$URL"
      - run: node build-dist.mjs
      - name: Smoke-test the production build
        run: pip install playwright && playwright install --with-deps chromium && python3 test-dist.py
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
