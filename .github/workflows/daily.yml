name: Daily publish and feeds
# 23:05 UTC = 00:05 in Lagos (UTC+1, no DST). Free on GitHub Actions; needs no credit card.
# Scheduled runs can be delayed by several minutes. GitHub pauses cron on repos with no activity for 60 days: re-enable under Actions.
on:
  schedule: [{ cron: '5 23 * * *' }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: daily-feeds, cancel-in-progress: false }
jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save --legacy-peer-deps firebase-admin@12
      - run: node job-daily.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ vars.SITE_URL }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
      - name: Commit feeds if changed
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add calendar.ics devotionals.xml podcast.xml 2>/dev/null || git add calendar.ics
          git diff --cached --quiet || (git commit -m "chore: refresh feeds" && git push)
