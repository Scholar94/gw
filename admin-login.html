<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Admin Login — CAC Good Works Assembly</title>
  <link rel="preload" href="font-jost-latin.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="preload" href="font-cinzel-latin.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="preload" href="font-cormorant-latin.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="preload" href="icons-solid.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="preload" href="icons-regular.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="preload" href="icons-brands.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="stylesheet" href="fonts.css"/>
  <link rel="stylesheet" href="icons.css"/>
  <link rel="stylesheet" href="admin-style.css">
  <meta name="robots" content="noindex,nofollow"/>
<script src="csp-events.js"></script>
</head>
<body>
<div class="login-page">
  <div class="login-bg">
    <div class="login-orb one"></div>
    <div class="login-orb two"></div>
    <div class="login-orb three"></div>
  </div>
  <div class="login-card" id="loginCard">
    <div class="login-logo">
      <img class="login-emblem-img" src="logo-mark.webp" width="72" height="72" alt="CAC Good Works Assembly" decoding="async">
      <span class="login-church-name">CAC Good Works Assembly</span>
      <span class="login-sub">Admin Portal</span>
    </div>
    <h2 class="login-title">Welcome Back</h2>
    <p class="login-desc">Sign in to access the admin dashboard</p>
    <div class="login-error" id="loginError">
      <i class="fas fa-exclamation-triangle"></i>
      <span id="loginErrorMsg">Invalid credentials</span>
    </div>
    <div class="floating-group">
      <input type="email" id="username" placeholder=" " autocomplete="username"/>
      <label for="username">Admin email</label>
    </div>
    <div class="floating-group">
      <input type="password" id="passcode" placeholder=" " autocomplete="current-password"/>
      <label for="passcode">Password</label>
      <button class="toggle-pass" type="button" data-on-click="togglePass()" aria-label="Toggle password">
        <i id="passIcon" class="fas fa-eye"></i>
      </button>
    </div>
    <button class="login-btn" id="loginBtn" data-on-click="doLogin()">
      <span class="btn-text"><i class="fas fa-sign-in-alt"></i> &nbsp;Sign In</span>
      <div class="spinner"></div>
    </button>
    <div class="login-back"><a href="index.html"><i class="fas fa-arrow-left"></i> Back to Website</a></div>
  </div>
</div>
<a href="https://wa.me/2348079731695?text=Hello%20CAC%20Good%20Works%20Assembly,%20I%20would%20like%20to%20make%20an%20enquiry." target="_blank" class="floating-whatsapp" style="opacity:1;" aria-label="WhatsApp">
  <i class="fab fa-whatsapp"></i><span class="wa-tooltip">Chat with us on WhatsApp</span><div class="wa-ripple"></div>
</a>
<script src="config.js"></script>
<script type="module" src="firebase.js"></script>
<script src="admin-login.js"></script>
</body>
</html>
