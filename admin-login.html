<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Admin Login — CAC Good Works Assembly</title>
  <link rel="preload" href="assets/fonts/jost-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="preload" href="assets/fonts/cinzel-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="preload" href="assets/fonts/cormorant-garamond-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="preload" href="assets/fontawesome/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="preload" href="assets/fontawesome/webfonts/fa-regular-400.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="preload" href="assets/fontawesome/webfonts/fa-brands-400.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="stylesheet" href="assets/fonts.css"/>
  <link rel="stylesheet" href="assets/fontawesome/css/all.min.css"/>
  <link rel="stylesheet" href="admin-style.css">
  <meta name="robots" content="noindex,nofollow"/>
</head>
<body>
<div class="login-page">
  <div class="login-bg">
    <div class="login-orb one"></div>
    <div class="login-orb two"></div>
    <div class="login-orb three"></div>
  </div>
  <div class="login-card" id="loginCard">
    <div class="login-logo">
      <span class="login-emblem">✦</span>
      <span class="login-church-name">CAC Good Works Assembly</span>
      <span class="login-sub">Admin Portal</span>
    </div>
    <h2 class="login-title">Welcome Back</h2>
    <p class="login-desc">Sign in to access the admin dashboard</p>
    <div class="login-error" id="loginError">
      <i class="fas fa-exclamation-triangle"></i>
      <span id="loginErrorMsg">Invalid credentials</span>
    </div>
    <div class="floating-group">
      <input type="email" id="username" placeholder=" " autocomplete="username"/>
      <label for="username">Admin email</label>
    </div>
    <div class="floating-group">
      <input type="password" id="passcode" placeholder=" " autocomplete="current-password"/>
      <label for="passcode">Password</label>
      <button class="toggle-pass" type="button" onclick="togglePass()" aria-label="Toggle password">
        <i id="passIcon" class="fas fa-eye"></i>
      </button>
    </div>
    <button class="login-btn" id="loginBtn" onclick="doLogin()">
      <span class="btn-text"><i class="fas fa-sign-in-alt"></i> &nbsp;Sign In</span>
      <div class="spinner"></div>
    </button>
    <div class="login-back"><a href="index.html"><i class="fas fa-arrow-left"></i> Back to Website</a></div>
  </div>
</div>
<a href="https://wa.me/2348079731695?text=Hello%20CAC%20Good%20Works%20Assembly,%20I%20would%20like%20to%20make%20an%20enquiry." target="_blank" class="floating-whatsapp" style="opacity:1;" aria-label="WhatsApp">
  <i class="fab fa-whatsapp"></i><span class="wa-tooltip">Chat with us on WhatsApp</span><div class="wa-ripple"></div>
</a>
<script src="config.js"></script>
<script type="module" src="firebase.js"></script>
<script>
function togglePass() {
  const inp  = document.getElementById('passcode');
  const icon = document.getElementById('passIcon');
  inp.type   = inp.type === 'password' ? 'text' : 'password';
  icon.className = inp.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
}
function showError(msg) {
  document.getElementById('loginErrorMsg').textContent = msg;
  document.getElementById('loginError').classList.add('show');
  const card = document.getElementById('loginCard');
  card.classList.add('shake'); setTimeout(() => card.classList.remove('shake'), 500);
}
const FRIENDLY = {
  'auth/invalid-credential': 'Incorrect email or password.',
  'auth/invalid-email': 'Please enter a valid email address.',
  'auth/user-disabled': 'This account has been disabled.',
  'auth/too-many-requests': 'Too many attempts. Please wait a few minutes and try again.',
  'auth/network-request-failed': 'Network error. Check your connection and try again.'
};
async function doLogin() {
  const email = document.getElementById('username').value.trim();
  const pass  = document.getElementById('passcode').value;
  const btn   = document.getElementById('loginBtn');
  document.getElementById('loginError').classList.remove('show');
  if (!email || !pass) return showError('Please enter your email and password.');
  await window.cacReady;
  if (!window.cacAuth || !window.cacAuth.available()) return showError('Admin sign-in is not available until Firebase is configured in firebase.js.');
  btn.classList.add('loading'); btn.disabled = true;
  try {
    await window.cacAuth.signIn(email, pass);
    // Wait for the role lookup; only registered admins (Firestore: admins/{uid}) may proceed.
    const unsub = window.cacAuth.onChange(async (user, role) => {
      if (!user) return;
      unsub && unsub();
      if (role) { window.location.href = 'admin-dashboard.html'; }
      else { await window.cacAuth.signOut(); showError('This account is not authorised for the admin area.'); btn.classList.remove('loading'); btn.disabled = false; }
    });
  } catch (e) {
    showError(FRIENDLY[e.code] || 'Sign-in failed. Please try again.');
    btn.classList.remove('loading'); btn.disabled = false;
    document.getElementById('passcode').value = '';
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
if (new URLSearchParams(location.search).get('reason') === 'timeout') showError('Session expired. Please sign in again.');
</script>
</body>
</html>
